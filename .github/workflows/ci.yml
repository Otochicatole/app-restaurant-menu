name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      APP_URL: http://127.0.0.1:3100
      DATABASE_URL: file:${{ github.workspace }}/test-results/verify-ci.db
      TEST_DATABASE_URL: file:${{ github.workspace }}/test-results/verify-ci.db
      JWT_SECRET: ci-only-secret-with-at-least-thirty-two-characters
      SUPER_ADMIN_EMAIL: ci-owner@example.com
      SUPER_ADMIN_PASSWORD: ci-only-password
      STORAGE_ROOT: ${{ github.workspace }}/.ci-storage
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify application
        run: bun run check:ci

  legacy-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify legacy database upgrade
        run: bun run test:migration-cutover
